name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Tests
        run: gradle :app:testReleaseUnitTest --no-daemon

      - name: Bauen
        run: gradle :app:assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk f1-flaggen-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: f1-flaggen-tv
          path: f1-flaggen-tv.apk

      - name: Release "latest" aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aktuelle Version (Build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          files: f1-flaggen-tv.apk
